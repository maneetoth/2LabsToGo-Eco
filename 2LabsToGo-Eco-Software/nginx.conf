events {}

http {
  client_max_body_size 50m;
  # WebSocket upgrade helper (Django Channels + Next dev HMR if you use it)
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream django_upstream { server app:8000; }
  upstream next_upstream   { server nextjs:3000; }

  server {
    listen 80;
    client_max_body_size 50m;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Django-owned routes ---
    location /api/      { proxy_pass http://django_upstream; }
    location /admin/    { proxy_pass http://django_upstream; }
    location /internal/ { proxy_pass http://django_upstream; }
    location /static/   { proxy_pass http://django_upstream; }
    location /media/    { proxy_pass http://django_upstream; }

    # WebSockets → Django (Channels)
    location /ws/ {
      proxy_pass http://django_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # --- Next.js under /next ---
    # Next assets when using basePath:'/next'
    location /next/_next/ {
      proxy_pass http://next_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # The Next app itself (no rewrite; keep the /next prefix)
    location /next/ {
      proxy_pass http://next_upstream;
      proxy_http_version 1.1;
    }

    # Everything else → Django templates
    location / {
      proxy_pass http://django_upstream;
    }

  }
}
